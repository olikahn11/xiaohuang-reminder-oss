[package]
name = "xuji"
version = "0.3.0"
description = "小黄提醒管家本地提醒与资料管理应用"
authors = ["小黄系列"]
license = "Proprietary"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-biometric = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
local-ip-address = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError", "NSUbiquitousKeyValueStore"] }
objc2-local-authentication = "0.3.2"
block2 = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-user-notifications = "0.3.2"

# Wry 0.55 在新版 iOS 模拟器查询 WebKit Bundle 时会触发 CoreFoundation
# SIGTRAP。保留上游源码，仅对 iOS 的版本查询使用稳定占位值。
[patch.crates-io]
wry = { path = "vendor/wry" }
