name: Bug 报告
description: 提交可复现的功能、兼容性或数据问题
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交密码、Token、证书、真实用户数据、备份文件或未修复漏洞的利用细节。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 0.4.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [Web/PWA, macOS, iPhone/iPad, Windows, Android, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: 1. 打开… 2. 点击… 3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供已脱敏日志或截图。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 此 Issue 不包含秘密信息或未修复漏洞的利用细节。
          required: true
